<nav class="step-nav" aria-label="Steps">
  <div class="step-nav__row">
    <button
      mat-icon-button
      type="button"
      class="step-nav__arrow"
      (click)="previous()"
      [disabled]="atStart"
      aria-label="Previous step"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <div class="step-nav__track">
      <span class="step-nav__cap" aria-hidden="true"></span>
      <mat-slider
        class="step-nav__slider"
        [min]="0"
        [max]="maxIndex"
        [step]="1"
        [discrete]="true"
        [displayWith]="displayLabel"
        [disabled]="steps.length < 2"
      >
        <input
          matSliderThumb
          [value]="sliderValue"
          (valueChange)="onSlider($event)"
        />
      </mat-slider>
      <span class="step-nav__cap" aria-hidden="true"></span>
    </div>

    <button
      mat-icon-button
      type="button"
      class="step-nav__arrow"
      (click)="next()"
      [disabled]="atEnd"
      aria-label="Next step"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
  <p class="step-nav__count">{{ currentLabel }}</p>
</nav>
