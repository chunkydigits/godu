<nav class="step-nav" aria-label="Steps">
  <div class="step-nav__row">
    <button
      mat-icon-button
      type="button"
      class="step-nav__arrow"
      (click)="previous()"
      [disabled]="atStart"
      aria-label="Previous step"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <div class="step-nav__track">
      <button
        type="button"
        class="step-nav__cap"
        (click)="goToFirst()"
        [disabled]="steps.length === 0 || selectedIndex === 0"
        aria-label="First step"
      ></button>
      <mat-slider
        class="step-nav__slider"
        [min]="0"
        [max]="maxIndex"
        [step]="1"
        [discrete]="true"
        [displayWith]="displayLabel"
        [disabled]="steps.length < 2"
      >
        <input
          matSliderThumb
          [ngModel]="sliderValue"
          (ngModelChange)="onSlider($event)"
        />
      </mat-slider>
      <button
        type="button"
        class="step-nav__cap"
        (click)="goToLast()"
        [disabled]="steps.length === 0 || selectedIndex === maxIndex"
        aria-label="Last step"
      ></button>
    </div>

    <button
      mat-icon-button
      type="button"
      class="step-nav__arrow"
      (click)="next()"
      [disabled]="atEnd"
      aria-label="Next step"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
  <p class="step-nav__count">{{ currentLabel }}</p>
</nav>
