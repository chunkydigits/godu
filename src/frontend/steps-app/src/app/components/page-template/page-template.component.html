<div class="page">
  @if (showHeader) {
    <header class="page__header">
      @if (title) {
        <h1 class="page__title">{{ title }}</h1>
      }
      @if (subtitle) {
        <p class="page__subtitle">{{ subtitle }}</p>
      }
    </header>
  }

  <main class="page__content">
    <ng-content />
  </main>
</div>
