# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - gd-lasp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Test
        run: dotnet test src/backend/Godu.sln --configuration Release

      - name: Publish API
        run: dotnet publish src/backend/Godu.Api/Godu.Api.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Verify publish output
        run: |
          test -f "${{ github.workspace }}/publish/Godu.Api.dll"
          ls -la "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

      - name: Create site zip
        run: |
          test -f "${{ github.workspace }}/publish/Godu.Api.dll"
          cd "${{ github.workspace }}/publish"
          zip -r "${{ github.workspace }}/site.zip" .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_115370EB958D430492FC5A0FDCF454D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73F554700D07409B96691C70F194084E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB279588C49349A78C45144CE9C6B0BB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "gd-lasp"
          slot-name: Production
          package: ${{ github.workspace }}/site.zip
